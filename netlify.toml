# Netlify build settings for a Next.js (App Router, SSR/ISR) site.
# Publish directory MUST be .next — the Next.js runtime (installed automatically
# by Netlify) turns it into functions + static assets. Publishing "out" or
# "public" instead makes every route fall through to Netlify's own 404 page.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
